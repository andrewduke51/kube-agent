apiVersion: v1
kind: ServiceAccount
metadata:
  name: kube-agent
  namespace: agent-demo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kube-agent-read-only
  namespace: agent-demo
rules:
  - apiGroups: [""]
    resources: ["pods", "events"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kube-agent-read-only
  namespace: agent-demo
subjects:
  - kind: ServiceAccount
    name: kube-agent
    namespace: agent-demo
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kube-agent-read-only
